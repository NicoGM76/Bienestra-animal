name: Final 1.0 CI

on:
  push:
    branches:
      - final/1.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create ephemeral Firebase config for CI
        shell: bash
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "bienestar-animal-ci",
              "storage_bucket": "bienestar-animal-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.bienestaranimal.zipaquira.demo"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyCIPlaceholderKey000000000000000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate Cloud Functions syntax
        run: node --check functions/index.js

      - name: Run unit tests
        run: gradle testDemoDebugUnitTest --stacktrace

      - name: Assemble demo APK
        run: gradle assembleDemoDebug --stacktrace
