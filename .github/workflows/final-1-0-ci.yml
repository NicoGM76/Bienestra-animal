name: Final 1.0 CI

on:
  push:
    branches:
      - final/1.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run unit tests
        run: ./gradlew testDemoDebugUnitTest --stacktrace

      - name: Assemble demo APK
        run: ./gradlew assembleDemoDebug --stacktrace
