name: Beta contract tests

on:
  push:
    branches:
      - beta/roles-institucionales
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Python contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: node --check app/src/main/assets/js/app.js

      - name: Run contract tests
        run: python -m unittest discover -s tests -v
