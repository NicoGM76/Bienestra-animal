name: Beta contract tests

on:
  push:
    branches:
      - beta/roles-institucionales
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beta-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Python contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: node --check app/src/main/assets/js/app.js

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

  android-compile:
    name: Android demo compile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create CI-only Firebase config
        shell: bash
        run: |
          mkdir -p app/src/demo
          cat > app/src/demo/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.bienestaranimal.zipaquira.demo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIPlaceholderKeyNotForRuntimeUse"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Compile demoDebug Kotlin
        run: gradle :app:compileDemoDebugKotlin --stacktrace
